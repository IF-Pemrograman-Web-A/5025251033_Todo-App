<!DOCTYPE html>
<html>
    <head>
        <title>To Do List</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 class = "tophead">To Do List</h1>
        <button id="dark-mode-btn" onclick="toggleDarkMode()">Dark Mode</button>
        <div class = "container">
             <div class = "tasks">
                <h2>Tasks Title: </h2>
                <ul id="task-list">
                </ul>
                <p>Click on a task to view its details.</p>
            </div>
            <div class = "detail">
                <h2 id="task-title">Task Details: Test</h2>
                <p id="task-details">Click on a task to view its details. Ini tampilan kalo dibaca detailsnya, misal bisa masukin apa aja tasknya dsb.</p>
            </div>
        </div>
        <div class = "Add-Task">
                <h2>Add Task</h2>
                <h2>New Task:</h2>
                <form class = "task-form">
                    <label for = "new-task-title">Task Title:</label>
                    <input type = "text" id = "new-task-title" name = "task-title">
                    <br>
                    <label for = "new-task-details">Task Details:</label>
                    <textarea id = "new-task-details" name = "task-details"></textarea>
                    <br>
                    <button type="button" onclick="addTask()">Add Task</button>
                </form>
            </div>
        <footer class="footer">
            <p>- This is footer - Hasil To Do List Sementara PWEB E01a - This is footer -</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
